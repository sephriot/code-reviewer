id: K-000021
title: Agent permission flags are explicit
type: gotcha
confidence: high
summary: The historical Python runner defaulted to agent --print --output-format json --trust; permission bypass requires an explicit REVIEW_AGENT_ARGV override.
details: The Go runner now mirrors the Python behavior. Set REVIEW_AGENT_ARGV to a JSON argv array when Agent must run headless tool calls without approval, for example ["agent","--print","--output-format","json","--trust","--force"]. When SHOW_THINKING is enabled, the runner converts output-format to stream-json and removes --stream-partial-output because the historical Python implementation documented that it could hang before the terminal result. No historical Python command globally bypassed Claude permissions.
tags:
- agent
- permissions
- tool-execution
sources:
