id: K-000009
title: Repeated policy evaluations retain audit without duplicate proposals
type: decision
confidence: high
summary: For one connection, pull request, canonical revision, observation, and current rule version, retain every repeated policy evaluation but create only the first proposal. This prevents repeated local reviews from replacing pending or already decided feedback; a new rule version or new evidence may propose again.
tags:
- policy
- proposals
- idempotency
