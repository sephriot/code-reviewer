id: K-000018
title: Web UI architecture and real-time updates
type: note
confidence: high
summary: Go templates + SSE + REST API. Embedded via go:embed. No websockets, no external JS framework.
details: |-
  Web server routes:
  - GET / — dashboard, shows open PRs + review queue
  - GET /pr/{id} — PR detail, shows review content, comments, publish buttons
  - GET /analytics — analytics page with period selector
  - GET /filtered — filtered-out PRs with manual "Request Review" button
  - GET /events — SSE endpoint for real-time events
  - POST /api/pr/{id}/review — create new review request (re-review)
  - POST /api/review/{id}/publish — submit full review to GitHub via API
  - POST /api/review/{id}/publish-comments — submit only inline comments
  - GET /api/analytics?period=30d&group=outcome — analytics data

  Real-time: Server.OnEvent called by reactor → channels to SSE subscribers.
  Browser notifications: Notification API, permission on first visit.
  Templates embedded via //go:embed templates/*.html static/*
  No websocket dependency — pure SSE.
