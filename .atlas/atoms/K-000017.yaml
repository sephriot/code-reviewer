id: K-000017
title: review tool output contract and outcome mapping
type: gotcha
confidence: high
summary: Tool must return JSON. Runner strips non-JSON prefix/suffix. Maps approve_without_comment/approve_with_comment/request_changes/requires_human_review to 4 DB outcomes.
details: |-
  Critical mapping logic in mapActionToOutcome:
  - "approve_without_comment" → approve_without_comments
  - "approve_with_comment" → approve_with_comments
  - "request_changes" → approve_with_comments (mapped to same outcome as approved-with-comments)
  - "requires_human_review" → human_review
  - default → tool_failed

  The tool output JSON schema (embedded in runner.go as outputFormatPrompt):
  { action, comment, summary, reason, comments: [{file, line, message}] }

  stripNonJSON() finds first { and last } to handle LLM wrapping text around JSON.
  Timeout is per-review, configurable, default 15min. Context deadline propagates to os/exec.
tags:
- tool-execution
- review
sources:
- internal/review/runner.go
