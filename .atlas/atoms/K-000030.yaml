id: K-000030
title: 'Review Queue shows #0 when PR missing from dashboard PRMap (fixed)'
type: gotcha
confidence: high
summary: 'Fixed: dashboard now GetPRs missing queue IDs into PRMap so filtered/history queued PRs render correctly.'
details: |-
  Dashboard Review Queue used to show bare #0 when the request PR was missing from PRMap (built only from ListPRsNeedingReview). Zero-value PullRequest rendered empty repo and PRNumber 0 — typical for manually queued filtered PRs.

  Fix: after seeding PRMap from needing-review PRs, load any queue PullRequestID still missing via GetPR. Covered by TestDashboardQueueShowsFilteredPR.
