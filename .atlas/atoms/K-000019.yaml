id: K-000019
title: SQLite TEXT dates require custom sql.Scanner
type: gotcha
confidence: high
summary: SQLite stores dates as TEXT via datetime('now'). Must implement custom sql.Scanner (scanTime/nullScanTime) to scan into time.Time.
details: |-
  SQLite datetime('now') returns TEXT like "2024-01-15 10:30:00".
  database/sql cannot scan TEXT into time.Time directly.
  Fix: create scanTime (implements sql.Scanner) and nullScanTime (nullable variant).
  Both parse "2006-01-02 15:04:05" format.
  All scan functions use these intermediaries then convert: pr.CreatedAt = time.Time(createdAt).
  DeletedAt uses nullScanTime scanning into go's *time.Time via deletedAt.Valid check.
  This avoids sql.NullString manual parsing that was needed before.
tags:
- database
- sqlite
- gotcha
sources:
- internal/db/db.go
