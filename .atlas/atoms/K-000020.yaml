id: K-000020
title: Runner subprocess observability
type: gotcha
confidence: high
summary: Review-tool subprocesses keep detailed stream logs while emitting concise terminal status lines.
details: 'Claude uses stream-json with partial messages; Agent uses stream-json with partial output. Both runners log command start, PID, stream lines, completion duration, result size, failures, and child stderr. The final result event is required and surfaced instead of being silently discarded. LOG_FILE configures an append-only log file while stderr remains visible. Terminal stdout is deliberately concise: only started/completed/failed status lines are emitted; detailed stream content stays in the log.'
sources:
- internal/review/runner.go
- cmd/code-reviewer/main.go
- internal/config/config.go
