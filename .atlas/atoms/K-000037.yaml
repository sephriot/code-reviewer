id: K-000037
title: Open stale PRs must run full processPR reconciliation
type: gotcha
confidence: high
summary: Open PRs missing from review-requested search need full processPR (SHA/queue), not only ensureExternalReview.
details: |-
  ## Symptom
  Open PRs stay on the dashboard with a stale commit_sha after new pushes once they leave `review-requested:` search.

  ## Cause
  `reconcileStalePRs` used to only call `ensureExternalReview` for still-open missing PRs and skipped SHA/needs_review/enqueue.

  ## Fix
  Route open stale rows through `processPR` so commit advances enqueue review requests. Author filters load `GetPRDetails` first so filtered rows store real SHAs.
