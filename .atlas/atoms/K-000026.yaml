summary: 'One-shot migrator imports pr_reviews + pending_approvals from reviews.db into go-reviewer.db. Dedup by (repo, pr, commit_sha); empty SHAs get synthetic legacy:nosha: markers. Skips own_prs/eye-markers/queue. Idempotent. Prefer edited_* and inline_comments JSON for review_comments.'
