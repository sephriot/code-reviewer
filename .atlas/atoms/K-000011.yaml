id: K-000011
title: Enabled publication retains GET-only reconciliation
type: decision
confidence: high
summary: Publication enabled must not disable periodic reconciliation. Reconciliation and hydration use only GET-capable GitHub paths; webhook-triggered projection work remains disabled in enabled mode, while publication still requires the separate ownership-guarded worker. Startup backfill also treats stale terminal PR targets as benign races.
